[package]
name = "ros-desktop"
version = "0.1.0"
description = "Cross-platform ROS 2 desktop GUI shell"
authors = ["ROS Desktop contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "ros_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "ros-desktop"
version = "0.1.0"
description = "Cross-platform ROS 2 desktop GUI shell"
authors = ["ROS Desktop contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "ros_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
# indexmap 1.9.x normally detects std by probing rustc through a stdin pipe
# (autocfg), which fails in restricted environments (Windows error 231).
# Forcing the `std` feature makes its build.rs emit `has_std` directly;
# feature unification propagates this to schemars/tauri-build.
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
# Same reason as the build-dependency above, for the target-side
# graph (tauri -> tauri-utils -> schemars -> indexmap).
indexmap = { version = "1.9", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"

[target.'cfg(unix)'.dependencies]
libc = '0.2'

[target.'cfg(windows)'.dependencies]
windows-sys = { version = '0.61', features = ['Win32_System_Console'] }

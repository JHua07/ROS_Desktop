[workspace]
name = "ros-desktop"
version = "0.1.0"
description = "Cross-platform ROS 2 desktop GUI shell"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["win-64", "linux-64"]

# First concrete workflow: run `ros2` CLI commands (ros2 topic list etc.)
# from the GUI shell. ros-core is the minimal RoboStack Jazzy baseline.
[dependencies]
ros-jazzy-ros-core = "*"

[workspace]
name = "ros-desktop"
version = "0.1.0"
description = "Cross-platform ROS 2 desktop GUI shell"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["win-64", "linux-64"]

# ros-core supports graph, echo, and launch; ros2bag is required for recording.
# GUI graph queries use daemon XML-RPC, not CLI subprocesses.
[dependencies]
ros-jazzy-ros-core = "*"
ros-jazzy-ros2bag = ">=0.26.11,<0.27"
ros-jazzy-tf2-msgs = ">=0.36.22,<0.37"

[environments.build.dependencies]
ros-jazzy-ros-core = ">=0.11.0,<0.12"
colcon-common-extensions = ">=0.3.0,<0.4"
ninja = ">=1.13.2,<2"
